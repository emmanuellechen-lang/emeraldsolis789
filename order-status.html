<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單查詢｜老巫元宇宙</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #2a0a4a 0%, #020818 70%);
    color: #f5e6c8;
    font-family: 'Noto Serif TC', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: rgba(20, 5, 45, 0.85);
    border: 2px solid rgba(212, 175, 55, 0.5);
    border-radius: 16px;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  h1 {
    color: #ffd700;
    font-size: 1.3rem;
    letter-spacing: 2px;
    margin-bottom: 1.2rem;
  }
  .icon { font-size: 3rem; margin-bottom: 0.8rem; }
  .status-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.6rem; }
  .status-paid { color: #7fff9a; }
  .status-pending { color: #ffd700; }
  .status-failed { color: #ff9999; }
  .detail-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    margin: 1rem 0;
    text-align: left;
    font-size: 0.85rem;
    line-height: 1.9;
  }
  .detail-box div { display: flex; justify-content: space-between; gap: 8px; }
  .item-row { border-top: 1px dashed rgba(212,175,55,0.25); margin-top: 0.4rem; padding-top: 0.4rem; }
  a.back-btn {
    display: inline-block;
    margin-top: 1rem;
    background: linear-gradient(135deg,#7b2d8b,#b8860b);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 0.75rem 1.6rem;
    border-radius: 8px;
    letter-spacing: 1px;
  }
  .muted { color: rgba(245,230,200,0.5); font-size: 0.78rem; margin-top: 0.8rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>✦ 訂單查詢 ✦</h1>
    <div id="content">
      <div class="icon">⏳</div>
      <div class="status-text">查詢中…</div>
    </div>
  </div>

<script>
(function () {
  var SUPABASE_URL = 'https://ruhgskjsmocpzsoqfcrd.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1aGdza2pzbW9jcHpzb3FmY3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwODM5NzIsImV4cCI6MjEwMTY1OTk3Mn0.zsIYJ11gSvR9yD1UB8z1t1_2E5ipRpqgtHOUDWevDUI';
  var STATUS_URL = SUPABASE_URL + '/functions/v1/get-order-status';
  var SITE_URL = 'https://emmanuellechen-lang.github.io/emeraldsolis789/';

  function qs(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var orderNo = qs('order_no');
  var content = document.getElementById('content');
  var attempts = 0;
  var maxAttempts = 8;

  function render(data) {
    var icon = '⏳', label = '處理中，請稍候…', cls = 'status-pending';
    if (data.status === 'paid') { icon = '✅'; label = '付款成功'; cls = 'status-paid'; }
    else if (data.status === 'failed') { icon = '❌'; label = '付款失敗或已取消'; cls = 'status-failed'; }
    else { icon = '⏳'; label = '訂單處理中（若使用 ATM/超商付款，取號後請於期限內完成繳費）'; cls = 'status-pending'; }

    var itemsHtml = (data.items || []).map(function (it) {
      return '<div class="item-row"><span>' + it.product_name + ' x' + it.quantity + '</span><span>NT$' + it.subtotal.toLocaleString() + '</span></div>';
    }).join('');

    content.innerHTML =
      '<div class="icon">' + icon + '</div>' +
      '<div class="status-text ' + cls + '">' + label + '</div>' +
      '<div class="detail-box">' +
      '<div><span>訂單編號</span><span>' + data.order_no + '</span></div>' +
      '<div><span>訂單金額</span><span>NT$' + data.amount.toLocaleString() + '</span></div>' +
      (data.payment_method ? '<div><span>付款方式</span><span>' + data.payment_method + '</span></div>' : '') +
      itemsHtml +
      '</div>' +
      '<a class="back-btn" href="' + SITE_URL + '">✦ 返回商店 ✦</a>' +
      (data.status === 'pending' ? '<div class="muted">頁面會每幾秒自動更新一次付款狀態</div>' : '');
  }

  function check() {
    if (!orderNo) {
      content.innerHTML = '<div class="icon">❓</div><div class="status-text">找不到訂單編號</div><a class="back-btn" href="' + SITE_URL + '">✦ 返回商店 ✦</a>';
      return;
    }
    fetch(STATUS_URL + '?order_no=' + encodeURIComponent(orderNo), {
      headers: {
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY
      }
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          content.innerHTML = '<div class="icon">❓</div><div class="status-text">' + (result.data.error || '找不到這筆訂單') + '</div><a class="back-btn" href="' + SITE_URL + '">✦ 返回商店 ✦</a>';
          return;
        }
        render(result.data);
        attempts++;
        if (result.data.status === 'pending' && attempts < maxAttempts) {
          setTimeout(check, 3000);
        }
      })
      .catch(function () {
        content.innerHTML = '<div class="icon">⚠️</div><div class="status-text">網路連線異常</div><a class="back-btn" href="' + SITE_URL + '">✦ 返回商店 ✦</a>';
      });
  }

  check();
})();
</script>
</body>
</html>
